<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RAG Q&A</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 2em;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin-bottom: 1em;
      color: #333;
    }

    #chatbox {
      width: 80%;
      max-width: 800px;
      background: #fff;
      padding: 1em;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .message {
      margin: 1em 0;
      white-space: pre-wrap;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
    }

    .user {
      color: #1565c0;
    }

    .bot {
      color: #2e7d32;
    }

    input[type="text"] {
      width: 90%;
      padding: 0.5em;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 0.5em 1em;
      font-size: 1em;
      margin-left: 0.5em;
      border: none;
      background-color: #1976d2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>
  <h2>Ask the question 👇</h2>
  <div id="chatbox">
    <div id="chat"></div>
    <input type="text" id="question" placeholder="Write your question" />
    <button onclick="ask()">Ask</button>
  </div>

  <script>
    async function ask() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");
      const question = input.value.trim();
      if (!question) return;

      chat.innerHTML += `<div class="message user"><strong>You:</strong> ${question}</div>`;
      input.value = "";
      
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        chat.innerHTML += `
          <div class="message bot">
            <strong>Answer:</strong> ${data.answer}
            <strong style='color: red;'>Context:</strong> ${data.context}
            <strong>Logs:</strong> ${data.trace}
          </div>
        `;
      } catch (err) {
        chat.innerHTML += `<div class="message bot">Request error: ${err}</div>`;
      }
    }

  </script>
</body>
</html>
